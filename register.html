<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - FreshFarm</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS riêng cho trang đăng ký -->
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <!-- Thanh điều hướng Navbar (Bootstrap 5) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="image/logo.png" alt="FreshFarm Logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Trang Chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="shop.html">Cửa Hàng / Danh Mục</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">Giới Thiệu</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Liên Hệ</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="login.html" class="btn btn-outline-success btn-sm rounded-pill px-3"><i class="bi bi-person"></i> Đăng nhập</a>
                    <a href="cart.html" class="btn btn-fresh position-relative">
                        <i class="bi bi-cart3"></i> Giỏ hàng
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger cart-count-badge">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Breadcrumb -->
    <div class="bg-light py-2 border-bottom">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="index.html" class="text-success text-decoration-none">Trang chủ</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Đăng Ký</li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- Main Content: Đăng ký -->
    <main class="auth-section py-5">
        <div class="container">
            <div class="card card-custom auth-card p-4">
                <h2 class="page-title text-center mb-3">Tạo tài khoản FreshFarm</h2>
                <div id="formAlert" role="alert"></div>
                <form id="registerForm" novalidate>
                    <div class="mb-3">
                        <label for="fullName" class="form-label">Họ và tên</label>
                        <input id="fullName" type="text" class="form-control" data-required>
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" type="text" class="form-control" data-required data-rule="email">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Số điện thoại</label>
                        <input id="phone" type="text" class="form-control" data-required data-rule="phone">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Mật khẩu (tối thiểu 6 ký tự)</label>
                        <div class="input-group has-validation">
                            <input id="password" type="password" class="form-control" data-required data-rule="password">
                            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#password" aria-label="Hiện/ẩn mật khẩu"><i class="bi bi-eye"></i></button>
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label>
                        <div class="input-group has-validation">
                            <input id="confirmPassword" type="password" class="form-control" data-required data-rule="match" data-match="#password">
                            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#confirmPassword" aria-label="Hiện/ẩn mật khẩu"><i class="bi bi-eye"></i></button>
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                    <div class="form-check mb-3">
                        <input id="terms" type="checkbox" class="form-check-input" data-required>
                        <label for="terms" class="form-check-label">Tôi đồng ý với điều khoản sử dụng</label>
                        <div class="invalid-feedback"></div>
                    </div>
                    <button class="btn btn-custom w-100" type="submit">Đăng ký</button>
                </form>
                <p class="text-center mt-3 mb-0">Đã có tài khoản? <a href="login.html" class="text-success fw-bold text-decoration-none">Đăng nhập</a></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 mt-5">
        <div class="container text-center text-muted small">
            Copyright 2026 © FreshFarm. All rights reserved.
        </div>
    </footer>

    <!-- jQuery, Bootstrap 5 JS & Custom JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
