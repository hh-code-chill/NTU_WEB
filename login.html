<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - FreshFarm</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS riêng cho trang đăng nhập -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body data-page="login">

    <!-- Thanh điều hướng Navbar (Bootstrap 5) -->
    <div id="auth-navbar-placeholder"></div>

    <!-- Breadcrumb -->
    <div class="bg-light py-2 border-bottom">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="index.html" class="text-success text-decoration-none">Trang chủ</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Đăng Nhập</li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- Main Content: Đăng nhập -->
    <main class="auth-section py-5">
        <div class="container">
            <div class="card card-custom auth-card p-4">
                <h2 class="page-title text-center mb-3">Đăng nhập</h2>
                <div id="formAlert" role="alert"></div>
                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" type="text" class="form-control" data-required data-rule="email">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <div class="input-group has-validation">
                            <input id="password" type="password" class="form-control" data-required data-rule="password">
                            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#password" aria-label="Hiện/ẩn mật khẩu"><i class="bi bi-eye"></i></button>
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                    <button class="btn btn-custom w-100" type="submit">Đăng nhập</button>
                </form>
                <p class="text-center mt-3 mb-0">Chưa có tài khoản? <a href="register.html" class="text-success fw-bold text-decoration-none">Đăng ký ngay</a></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="auth-footer-placeholder"></div>

    <!-- jQuery, Bootstrap 5 JS & Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/components.js"></script>
</body>
</html>
