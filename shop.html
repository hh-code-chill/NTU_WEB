<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gian Hàng Sản Phẩm - FreshFarm</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/shop.css" />
  </head>
  <body data-page="shop">
    <div id="site-header-placeholder"></div>

    <!-- Breadcrumb & Layout chính -->
    <div class="container mt-3 mb-5">
      <div class="row g-4">
        <!-- Sidebar - Bộ Lọc Bên Trái -->
        <aside class="col-lg-3">
          <div class="card border-0 shadow-sm p-3 mb-4 rounded-3">
            <h5 class="fw-bold text-success border-bottom pb-2 mb-3">
              <i class="fas fa-filter me-2"></i>Bộ Lọc Sản Phẩm
            </h5>

            <!-- Lọc theo Danh mục -->
            <div class="mb-4">
              <h6 class="fw-bold text-dark mb-2">Danh Mục</h6>
              <div class="form-check my-1">
                <input
                  class="form-check-input filter-category"
                  type="radio"
                  name="category"
                  id="cat-all"
                  value="all"
                  checked
                />
                <label class="form-check-label" for="cat-all"
                  >Tất cả danh mục</label
                >
              </div>
              <div class="form-check my-1">
                <input
                  class="form-check-input filter-category"
                  type="radio"
                  name="category"
                  id="cat-do-kho"
                  value="do-kho"
                />
                <label class="form-check-label" for="cat-do-kho">Đồ khô</label>
              </div>
              <div class="form-check my-1">
                <input
                  class="form-check-input filter-category"
                  type="radio"
                  name="category"
                  id="cat-gia-vi"
                  value="gia-vi"
                />
                <label class="form-check-label" for="cat-gia-vi">Gia vị</label>
              </div>
              <div class="form-check my-1">
                <input
                  class="form-check-input filter-category"
                  type="radio"
                  name="category"
                  id="cat-hat-dinh-duong"
                  value="hat-dinh-duong"
                />
                <label class="form-check-label" for="cat-hat-dinh-duong"
                  >Hạt dinh dưỡng</label
                >
              </div>
              <div class="form-check my-1">
                <input
                  class="form-check-input filter-category"
                  type="radio"
                  name="category"
                  id="cat-rau-cu"
                  value="rau-cu"
                />
                <label class="form-check-label" for="cat-rau-cu"
                  >Rau củ sạch</label
                >
              </div>
            </div>

            <!-- Lọc theo Tầm giá -->
            <div class="mb-4">
              <h6 class="fw-bold text-dark mb-2">Khoảng Giá</h6>
              <div class="form-check my-1">
                <input
                  class="form-check-input filter-price"
                  type="radio"
                  name="priceRange"
                  id="price-all"
                  value="all"
                  checked
                />
                <label class="form-check-label" for="price-all"
                  >Tất cả mức giá</label
                >
              </div>
              <div class="form-check my-1">
                <input
                  class="form-check-input filter-price"
                  type="radio"
                  name="priceRange"
                  id="price-under-100"
                  value="under-100"
                />
                <label class="form-check-label" for="price-under-100"
                  >Dưới 100.000đ</label
                >
              </div>
              <div class="form-check my-1">
                <input
                  class="form-check-input filter-price"
                  type="radio"
                  name="priceRange"
                  id="price-100-200"
                  value="100-200"
                />
                <label class="form-check-label" for="price-100-200"
                  >100.000đ – 200.000đ</label
                >
              </div>
              <div class="form-check my-1">
                <input
                  class="form-check-input filter-price"
                  type="radio"
                  name="priceRange"
                  id="price-200-500"
                  value="200-500"
                />
                <label class="form-check-label" for="price-200-500"
                  >200.000đ – 500.000đ</label
                >
              </div>
              <div class="form-check my-1">
                <input
                  class="form-check-input filter-price"
                  type="radio"
                  name="priceRange"
                  id="price-above-500"
                  value="above-500"
                />
                <label class="form-check-label" for="price-above-500"
                  >Trên 500.000đ</label
                >
              </div>
            </div>

            <!-- Lọc theo Thương hiệu / Nhãn hiệu -->
            <div class="mb-3">
              <h6 class="fw-bold text-dark mb-2">Thương Hiệu</h6>
              <div class="form-check my-1">
                <input
                  class="form-check-input filter-brand"
                  type="checkbox"
                  value="dung-ha"
                  id="brand-dung-ha"
                />
                <label class="form-check-label" for="brand-dung-ha"
                  >Nông Sản Dũng Hà</label
                >
              </div>
              <div class="form-check my-1">
                <input
                  class="form-check-input filter-brand"
                  type="checkbox"
                  value="fresh-farm"
                  id="brand-fresh-farm"
                />
                <label class="form-check-label" for="brand-fresh-farm"
                  >FreshFarm</label
                >
              </div>
              <div class="form-check my-1">
                <input
                  class="form-check-input filter-brand"
                  type="checkbox"
                  value="vietgap"
                  id="brand-vietgap"
                />
                <label class="form-check-label" for="brand-vietgap"
                  >VietGAP</label
                >
              </div>
            </div>

            <!-- Nút Bỏ Lọc -->
            <button
              type="button"
              id="btn-reset-filter"
              class="btn btn-outline-danger btn-sm w-100 mt-2"
            >
              <i class="fas fa-undo me-1"></i>Đặt lại bộ lọc
            </button>
          </div>
        </aside>

        <!-- Main Content - Lưới Sản Phẩm -->
        <main class="col-lg-9">
          <!-- Toolbar - Đếm số lượng & Sắp xếp -->
          <div class="card border-0 shadow-sm p-3 mb-4 rounded-3">
            <div
              class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3"
            >
              <p class="mb-0 text-muted small" id="result-count">
                Đang hiển thị
                <span class="fw-bold text-dark" id="showing-count">0</span> sản
                phẩm
              </p>

              <div class="d-flex align-items-center gap-2">
                <label
                  for="sort-by"
                  class="text-nowrap small fw-bold text-secondary"
                  >Sắp xếp:</label
                >
                <select
                  id="sort-by"
                  class="form-select form-select-sm"
                  style="width: 200px"
                >
                  <option value="default">Mặc định</option>
                  <option value="newest">Mới nhất</option>
                  <option value="price-asc">Giá: Thấp đến Cao</option>
                  <option value="price-desc">Giá: Cao đến Thấp</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Product Grid System -->
          <div
            class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3 mb-4"
            id="shop-product-grid"
          >
            <!-- Danh sách sản phẩm sẽ được JavaScript render tự động tại đây -->
          </div>

          <!-- Thanh Phân Trang (Pagination) -->
          <nav
            aria-label="Product Pagination"
            class="d-flex justify-content-center mt-4"
          >
            <ul class="pagination pagination-sm" id="pagination-list">
              <!-- Nút phân trang sẽ được JS render tại đây -->
            </ul>
          </nav>
        </main>
      </div>
    </div>

    <!-- Footer-->
    <div id="site-footer-placeholder"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <!-- Data & Custom JS -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/components.js"></script>
</body>
</html>
